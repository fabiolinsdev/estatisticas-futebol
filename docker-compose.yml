services:
  postgres:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: estatisticas
      POSTGRES_PASSWORD: estatisticas
      POSTGRES_DB: estatisticas
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estatisticas -d estatisticas"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
