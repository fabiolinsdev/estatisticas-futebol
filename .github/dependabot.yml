version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-e-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint só aceita TypeScript abaixo da 6.1 (ADR-0004)
      - dependency-name: typescript
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      actions-minor-e-patch:
        update-types: [minor, patch]
