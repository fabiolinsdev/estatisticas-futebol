name: Coleta

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    name: Migrações e coleta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run collect
